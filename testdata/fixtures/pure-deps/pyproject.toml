[project]
name = "pure-deps"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["six==1.17.0", "tabulate==0.9.0"]

# Hermetic fixture: every Package comes from the committed PEP 503 (simple) index
# directory, never from PyPI. tabulate ships a console script, so the
# install exercises bin/ cleanup.
[[tool.uv.index]]
name = "fixture-wheels"
url = "./simple"
default = true
