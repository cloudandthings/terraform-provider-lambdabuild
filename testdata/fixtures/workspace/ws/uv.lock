[package.metadata.requires-dev]
dev = [{ name = "wsdev", editable = "packages/wsdev" }]

[[package]]
name = "wsdev"
version = "0.4.0"
source = { editable = "packages/wsdev" }

[[package]]
name = "wsextra"
version = "0.3.0"
source = { editable = "packages/wsextra" }
dependencies = [
    { name = "tabulate" },
]

[package.metadata]
requires-dist = [{ name = "tabulate", specifier = "==0.9.0" }]

[[package]]
name = "wslib"
version = "0.2.0"
source = { editable = "packages/wslib" }
dependencies = [
    { name = "six" },
]

[package.metadata]
requires-dist = [{ name = "six", specifier = "==1.17.0" }]

[[package]]
name = "wsother"
version = "0.5.0"
source = { editable = "packages/wsother" }
