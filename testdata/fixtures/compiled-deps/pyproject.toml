[project]
name = "compiled-deps"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fakeext==1.0"]

# Hermetic stand-in for a compiled Package (numpy): fakeext ships one Linux
# wheel per architecture, each carrying a marker naming its architecture.
[[tool.uv.index]]
name = "fixture-wheels"
url = "./simple"
default = true
