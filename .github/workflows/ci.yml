name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml dispatches this on the release-please PR branch when no
  # pull_request run starts there by itself (that PR is pushed with
  # GITHUB_TOKEN, which usually triggers none).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the expensive jobs on PRs that only touch prose. The filter is a
  # denylist: any path not listed here runs the full matrix, so a new input
  # can never be skipped by accident. Pushes to main always run everything.
  # Generated docs (docs/index.md, docs/resources/, docs/guides/), templates/,
  # examples/, CHANGELOG.md and licenses/ stay in: docs:validate or the release
  # archives depend on them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!ROADMAP.md'
              - '!GLOSSARY.md'
              - '!CLAUDE.md'
              - '!docs/README.md'
              - '!docs/adr/**'
              - '!docs/architecture/**'
              - '!docs/development/**'
              - '!.agents/**'
              - '!.claude/**'

  ci:
    name: ci (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: mise run ci

  # Squash merges make the PR title the commit on main, and release-please
  # builds the version bump and CHANGELOG.md from those titles. After fixing a
  # title, re-run this job: it reads the current title.
  pr-title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Keep in sync with changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            redeploy
            revert
            docs
            chore
            ci
            build
            test
            refactor
            style

  release-snapshot:
    name: release snapshot
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: mise run release:snapshot
      - run: mise run release:verify

  # The single required status check for main. Passes when every job above
  # passed or was skipped by the filter; fails if any failed or was cancelled.
  ci-ok:
    name: ci-ok
    needs: [changes, pr-title, ci, release-snapshot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
